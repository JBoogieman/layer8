name: Bug report
description: Something in Layer8 doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The more of this you fill in, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you clicked and what Layer8 did. A screenshot helps.
      placeholder: Right-click a collection, Client Actions, Quick Status. The window...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Right-click...
        2. ...
    validations:
      required: true
  - type: input
    id: layer8-version
    attributes:
      label: Layer8 version
      description: The first line of each console session in %LOCALAPPDATA%\Layer8\Logs\Layer8.log shows it.
      placeholder: 0.8.1
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How Layer8 is installed
      options:
        - Approved console extension (Layer8-<version>.cab)
        - MSI (Layer8.msi)
        - Developer install (Install-Layer8Dev.ps1)
    validations:
      required: true
  - type: input
    id: configmgr-version
    attributes:
      label: ConfigMgr version
      placeholder: 2509 (console 5.2509.1038.1000)
    validations:
      required: true
  - type: input
    id: device-os
    attributes:
      label: Windows on the devices it ran against
      placeholder: Windows 11 24H2, Server 2022
  - type: textarea
    id: log
    attributes:
      label: Layer8.log
      description: |
        The lines around the problem, from %LOCALAPPDATA%\Layer8\Logs\Layer8.log. Setting the log level to Debug in Layer8 Settings adds more detail.
        Look it over before posting: it has device and user names.
      render: text
